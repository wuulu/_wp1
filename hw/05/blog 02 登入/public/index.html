<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Blog</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>My Blog</h1>

    <div id="auth-section">
      <div id="auth-form" class="card">
        <h2 id="auth-title">Login</h2>
        <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
        <div class="form-actions">
          <button id="auth-submit">Login</button>
          <button id="auth-toggle" class="btn-secondary">Switch to Register</button>
        </div>
        <div id="auth-error" class="error-msg"></div>
      </div>
      <div id="user-info" class="card" style="display:none">
        <span>Logged in as <strong id="user-name"></strong></span>
        <button id="logout-btn" class="btn-secondary">Logout</button>
      </div>
    </div>

    <div id="post-form-container" class="card" style="display:none">
      <h2 id="form-title">New Post</h2>
      <input type="text" id="post-title" placeholder="Title">
      <textarea id="post-content" placeholder="Content"></textarea>
      <input type="hidden" id="edit-id" value="">
      <div class="form-actions">
        <button id="submit-btn">Publish</button>
        <button id="cancel-btn" class="btn-secondary" style="display:none">Cancel</button>
      </div>
    </div>

    <div id="posts-list"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
